name: Keep Backend Awake

# El servidor de Render (plan gratuito) se duerme tras 15 min sin
# visitas. Si está dormido justo a las 6:00/14:00/22:00 (hora CDMX), los
# reportes automáticos de Telegram nunca se disparan porque el reloj
# interno del proceso no corre mientras está dormido. Este workflow lo
# despierta cada 10 minutos, las 24 horas, sin depender de un servicio
# externo ni de tráfico real de visitantes.
#
# Tambien sirve como monitor del bot de Telegram: si TELEGRAM_BOT_TOKEN
# se invalida o revoca, el servidor sigue respondiendo 200 OK (el bug NO
# es "servidor caído") pero el chat y los reportes automáticos se quedan
# completamente mudos y en silencio. Este workflow revisa el campo
# "telegramOk" de /api/keep-alive y falla (avisando por correo) si eso
# pasa, en vez de depender de que alguien note manualmente que "hola" no
# responde.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Antes esto siempre terminaba "exitosamente" (con `|| true`) sin
      # importar si el servidor respondía o no — un deploy roto (como el
      # bug de DATA_DIR que tumbaba el servidor en cada arranque) podía
      # pasar desapercibido indefinidamente. Ahora, si el servidor no
      # responde tras 2 intentos, este paso falla de verdad, y GitHub
      # manda un correo automático al dueño del repositorio avisando que
      # el workflow programado falló — sin necesidad de configurar ningún
      # secreto adicional.
      #
      # Ademas, el servidor puede responder 200 OK perfectamente mientras
      # el bot de Telegram esta completamente mudo (token invalido/revocado
      # en TELEGRAM_BOT_TOKEN) — eso pasó y nadie se enteró porque
      # callTelegram() nunca revisaba el resultado de sus propias llamadas.
      # Ahora /api/keep-alive expone "telegramOk", y este paso tambien
      # falla (con el mismo correo automatico) si viene en false.
      - name: Ping keep-alive endpoint y verificar que Telegram responda
        run: |
          check() {
            body="$(curl -sf --max-time 30 "https://brain-branding-demo-generator.onrender.com/api/keep-alive")" || return 1
            echo "$body"
            echo "$body" | grep -q '"telegramOk":true'
          }
          check && exit 0
          echo "Primer intento falló (servidor caído o Telegram roto), reintentando en 20s..."
          sleep 20
          check
