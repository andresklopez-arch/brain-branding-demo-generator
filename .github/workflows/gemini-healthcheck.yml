name: Daily Gemini AI Healthcheck

# testGeminiConnection() antes solo corría una vez al arrancar el proceso
# (api/telegram.js). En el plan gratuito de Render, keep-alive.yml
# mantiene el proceso despierto cada 10 min, así que en la práctica podía
# pasar semanas sin que este chequeo volviera a correr — si Google
# retiraba el modelo activo a medio día (ya pasó antes con
# 2.0-flash/1.5-flash), nadie se enteraba hasta que un cliente notara
# respuestas robotizadas por el respaldo de reglas fijas. Este workflow
# llama al mismo chequeo una vez al día sin necesidad de reiniciar el
# servidor, y falla (avisando por correo) si Gemini no responde,
# independientemente de la alerta que el propio servidor ya manda por
# Telegram.
on:
  schedule:
    - cron: "0 13 * * *" # 7:00 AM hora CDMX (UTC-6)
  workflow_dispatch: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar chequeo diario del motor de IA (Gemini)
        run: curl -sf --max-time 30 "https://brain-branding-demo-generator.onrender.com/api/admin/gemini-healthcheck"
