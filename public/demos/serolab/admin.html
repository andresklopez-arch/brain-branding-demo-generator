<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Branding Admin | Expediente en Vivo - SERO LAB LIMS 4.0</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0B0F19;
      --bg-card: #111827;
      --primary: #4F46E5;
      --teal: #0D9488;
      --teal-light: #2DD4BF;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --border: rgba(255, 255, 255, 0.08);
      --gold: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 24px;
    }
    .brand-title h1 { font-size: 18px; font-weight: 800; color: #FFF; }
    .brand-title span { font-size: 12px; color: var(--teal-light); font-weight: 700; }

    .header-actions { display: flex; gap: 12px; align-items: center; }
    .btn-refresh {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-print {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #FFF;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-card .num { font-size: 24px; font-weight: 800; color: var(--teal-light); font-family: 'JetBrains Mono', monospace; }
    .stat-card .lbl { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.filled { border-color: rgba(13, 148, 136, 0.4); }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .card-head h3 { font-size: 14px; font-weight: 700; color: #FFF; }
    .card-area { font-size: 10.5px; font-weight: 700; color: var(--teal-light); background: rgba(13, 148, 136, 0.15); padding: 3px 8px; border-radius: 6px; }

    .sec { margin-bottom: 10px; }
    .sec-label { font-size: 10.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 3px; }
    .sec-txt { font-size: 12.5px; color: #E2E8F0; line-height: 1.4; }
    .submods-tag { display: inline-block; background: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.3); font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin: 2px; }

    .card-footer { font-size: 10px; color: var(--text-dim); margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">
        <h1>🧠 BRAIN BRANDING — PANEL ADMIN EN VIVO</h1>
        <span>Expediente de Requerimientos LIMS 4.0: SERO LAB Grupo Diagnóstico</span>
      </div>
      <div class="header-actions">
        <button class="btn-refresh" onclick="fetchLiveRequirements()">🔄 Actualizar Datos</button>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="num" id="statConfigured">0 / 18</div>
        <div class="lbl">Módulos Nutridos por el Cliente</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statSubmods">0</div>
        <div class="lbl">Submódulos Especiales Seleccionados</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statLastUpdate">--:--</div>
        <div class="lbl">Última Modificación Registrada</div>
      </div>
    </div>

    <main class="feed-grid" id="adminGrid">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
        Cargando expediente en tiempo real...
      </div>
    </main>
  </div>

  <script src="js/modules-data.js"></script>
  <script>
    const API_URL = 'https://brain-branding-demo-generator.onrender.com/api/serolab/requirements';

    async function fetchLiveRequirements() {
      const grid = document.getElementById("adminGrid");
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const reqs = data.requirements || {};
        renderAdminDashboard(reqs);
      } catch (e) {
        console.warn("Falling back to local data:", e);
        const local = localStorage.getItem("serolab_lims_requirements_v2");
        renderAdminDashboard(local ? JSON.parse(local) : {});
      }
    }

    function renderAdminDashboard(reqs) {
      const grid = document.getElementById("adminGrid");
      grid.innerHTML = "";

      let count = 0;
      let totalSub = 0;
      let lastDate = null;

      SEROLAB_MODULES.forEach(m => {
        const userReq = reqs[m.id];
        if (userReq) {
          count++;
          if (userReq.submodules) totalSub += userReq.submodules.length;
          if (userReq.updatedAt) lastDate = new Date(userReq.updatedAt);
        }

        const uso = userReq ? userReq.uso : '<span style="color: #64748B;">(Sin observaciones aún)</span>';
        const deseo = userReq ? userReq.deseo : '<span style="color: #64748B;">(Sin requerimientos específicos)</span>';
        const area = userReq ? userReq.authorArea : 'General';
        const submods = userReq && userReq.submodules && userReq.submodules.length > 0
          ? userReq.submodules.map(s => `<span class="submods-tag">✓ ${s}</span>`).join(' ')
          : '<span style="color: #64748B; font-size: 11px;">Ninguno</span>';

        const card = document.createElement("div");
        card.className = `card ${userReq ? 'filled' : ''}`;
        card.innerHTML = `
          <div>
            <div class="card-head">
              <h3>${m.name}</h3>
              <span class="card-area">${area}</span>
            </div>
            <div class="sec">
              <div class="sec-label">1. Uso Actual en SERO LAB:</div>
              <div class="sec-txt">${uso}</div>
            </div>
            <div class="sec">
              <div class="sec-label">2. Requerimientos & Deseos:</div>
              <div class="sec-txt" style="color: var(--teal-light); font-weight: 500;">${deseo}</div>
            </div>
            <div class="sec">
              <div class="sec-label">Submódulos Seleccionados:</div>
              <div>${submods}</div>
            </div>
          </div>
          <div class="card-footer">
            ${userReq && userReq.updatedAt ? 'Actualizado: ' + new Date(userReq.updatedAt).toLocaleString('es-MX') : 'Estado: Pendiente de revisión por el cliente'}
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById("statConfigured").textContent = `${count} / 18`;
      document.getElementById("statSubmods").textContent = `${totalSub}`;
      document.getElementById("statLastUpdate").textContent = lastDate ? lastDate.toLocaleTimeString('es-MX') : 'En espera';
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetchLiveRequirements();
      // Auto refresh every 30 seconds
      setInterval(fetchLiveRequirements, 30000);
    });
  </script>
</body>
</html>
