<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Enlace Expirado o Roto | Brain Branding</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap');

    :root {
      --bg: #06080c;
      --primary: #6366f1;
      --secondary: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Cyber grid background */
    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center;
      z-index: 1;
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.15;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .container {
      max-width: 600px;
      width: 90%;
      text-align: center;
      z-index: 3;
      padding: 40px;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .glitch-code {
      font-family: 'Outfit', sans-serif;
      font-size: 110px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      letter-spacing: -2px;
      animation: pulseCode 3s infinite alternate ease-in-out;
    }

    @keyframes pulseCode {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.2)); }
      100% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.4)); }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #fff;
    }

    p {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .btns {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="grid"></div>
  <div class="glow-orb"></div>

  <div class="container">
    <div class="glitch-code">404</div>
    <h1>Enlace Inexistente o Expirado</h1>
    <p>
      El demo o recurso que estás intentando abrir ha superado su tiempo límite de vida útil (15 días) y se ha autolimpiado de forma segura del servidor, o bien la dirección web está mal escrita.
    </p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Volver al Inicio</a>
      <a href="https://wa.me/527712339238?text=Hola%20Brain%20Branding%2C%20intente%20abrir%20un%20enlace%20de%20demo%20pero%20me%20aparece%20que%20ya%20ha%20expirado.%20%C2%BFMe%20podr%C3%ADan%20ayudar%3F" class="btn btn-secondary" target="_blank">Contactar Soporte 💬</a>
    </div>
  </div>

</body>
</html>
